<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Business Manager Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-card" style="max-width: 600px; width: 100%;">
    <div class="auth-header">
      <div class="logo" style="justify-content: center; margin-bottom: 12px;">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Manager PRO</span>
      </div>
      <h1>Create Business Profile</h1>
      <p>Fill out the profile details to initialize your business manager account</p>
    </div>
    
    <div id="errorAlert" class="badge badge-danger" style="display: none; width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; text-transform: none; font-size: 13px; font-weight: 500; line-height: 1.4;"></div>

    <form id="signupForm" style="display: flex; flex-direction: column; gap: 16px;">
      <!-- Grid Row 1 -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="e.g. Sarah Jenkins" required>
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose username" required minlength="3" autocomplete="username">
        </div>
      </div>
      
      <!-- Grid Row 2 -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="e.g. name@company.com" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="e.g. +1 555-0199" required>
        </div>
      </div>

      <!-- Business Name Row -->
      <div class="form-group">
        <label for="businessName">Business / Company Name</label>
        <input type="text" id="businessName" placeholder="e.g. Apex Agri Logistics" required>
      </div>

      <!-- Grid Row 3 (Passwords) -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat password" required minlength="6" autocomplete="new-password">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">Create Account</button>
    </form>

    <div class="auth-link">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

  <script>
    // Redirect if already authenticated
    if (localStorage.getItem('token')) {
      window.location.href = '/home.html';
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorAlert = document.getElementById('errorAlert');
      errorAlert.style.display = 'none';

      // Verify passwords match
      if (password !== confirmPassword) {
        errorAlert.textContent = "Passwords do not match. Please verify.";
        errorAlert.style.display = 'block';
        return;
      }

      const payload = {
        full_name: document.getElementById('fullName').value.trim(),
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        business_name: document.getElementById('businessName').value.trim(),
        password: password
      };

      try {
        const response = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Failed to initialize account');
        }

        // Store credentials
        localStorage.setItem('token', data.token);
        localStorage.setItem('userId', data.user.id);
        localStorage.setItem('username', data.user.username);

        window.location.href = '/home.html';
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
